<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />

  <!-- Outer glow ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="8" />

  <!-- Speed lines -->
  <path d="M 80 180 L 140 180" stroke="url(#accentGrad)" stroke-width="12" stroke-linecap="round" opacity="0.8"/>
  <path d="M 60 256 L 150 256" stroke="url(#accentGrad)" stroke-width="14" stroke-linecap="round"/>
  <path d="M 90 332 L 130 332" stroke="url(#accentGrad)" stroke-width="10" stroke-linecap="round" opacity="0.6"/>

  <!-- Delivery Box Icon with Rocket/Lightning -->
  <g filter="url(#shadow)">
    <path d="M 210 160 L 370 160 C 390 160 400 175 400 195 L 390 320 C 390 340 375 350 355 350 L 210 350 C 190 350 175 335 175 315 L 185 195 C 185 175 195 160 210 160 Z" fill="#ffffff"/>
    <path d="M 175 220 L 400 220" stroke="#e2e8f0" stroke-width="6"/>
    <path d="M 290 180 L 250 260 L 285 260 L 260 330 L 325 245 L 290 245 Z" fill="url(#accentGrad)"/>
  </g>

  <!-- UbaVoy Text Badge -->
  <text x="256" y="430" font-family="'Outfit', 'Inter', system-ui, sans-serif" font-weight="900" font-size="44" fill="#ffffff" text-anchor="middle" letter-spacing="2">
    UBA<tspan fill="#f59e0b">VOY</tspan>
  </text>
</svg>
